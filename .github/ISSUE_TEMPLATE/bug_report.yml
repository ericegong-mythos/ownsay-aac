name: Bug report
description: Report a reproducible problem without including personal data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never attach a real backup, recording, identifying screenshot, or child-specific vocabulary list. Report security issues privately through the Security tab."
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Describe the user-observable problem and what you expected instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: "Example: Fire tablet / Silk 120, or iPad / Safari 18"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction using fictional data
      description: Give the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real names, preferences, backups, recordings, and identifying images.
          required: true
